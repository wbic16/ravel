[package]
name = "ravel"
version = "0.12.1"
edition = "2021"
description = "Transcript-graph engine: a transcript becomes a graph of meaning. git-lex / Pool sibling."
license = "Apache-2.0"
repository = "https://github.com/repolex-ai/ravel"

[lib]
name = "ravel"
path = "src/lib.rs"

# raveld — the daemon. One per machine; the only process that writes a soul's
# transcript store. Mirrors and ingests every registered soul on its own
# schedule. There are no hooks (goodlux, 2026-09-22).
[[bin]]
name = "raveld"
path = "src/bin/raveld.rs"

# ravel — the command line. A thin client of raveld; starts it when it is not
# running. Never opens a store itself.
[[bin]]
name = "ravel"
path = "src/bin/ravel.rs"

[dependencies]
# The graph layer is phext-only (2026-11-27): the store and the SPARQL
# evaluator are the phext-serve library in this repo (holo-phext quad set
# + the SPARQL-subset evaluator), path-depended on here — one evaluator,
# one store, two seats (the phext-serve binary and this daemon).
phext-serve = { path = "phext/serve" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No date/time crate: the used surface (RFC 3339 parse/format,
# local time, durations) lives in src/time — see PATCHES.md.
anyhow = "1"
# Deterministic annotation IRIs (idempotent reimport — the w4r3z discipline).
sha2 = "0.10"
# The daemon's HTTP surface runs on phext-serve's bare-tokio HTTP
# layer (phext_serve::http) — one HTTP stack for both servers.
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# No HTTP-client crate: ravel talks to raveld over plain HTTP via
# src/http_client (in-tree), and the one HTTPS call (Anthropic) runs
# through a Python-stdlib helper in src/writer — see PATCHES.md.
serde_yaml = "0.9"
# Outside queries are prepared in-tree (src/outside.rs): the ontology
# rewrite the calamus crate used to perform is applied as Prep data
# derived from the shipped ontologies, calamus's own closure ported —
# the same port the phext backend runs (ontology_prep()).
# Who is asking, and whether they may: tessera's gate surface, ported
# in-tree as src/tessera (upstream repolex-ai/tessera @ 1142eb6) with
# Ed25519 verification served by src/ed25519 — see PATCHES.md. base64
# is the port's one crates.io helper (already in the tree, PASS).
base64 = "0.22"
